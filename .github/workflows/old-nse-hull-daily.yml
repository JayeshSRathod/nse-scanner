name: Old NSE Hull Daily Paper Radar

on:
  schedule:
    # 23:05 UTC Sunday-Thursday = 04:35 IST Monday-Friday.
    # Runs after the shared data pipeline and leaves buffer for GitHub queue delays.
    - cron: '5 23 * * 0-4'
  workflow_dispatch:
  pull_request:
    paths:
      - 'old_nse_hull/**'
      - 'scripts/run_old_nse_hull_local.py'
      - '.github/workflows/old-nse-hull-daily.yml'

permissions:
  contents: write

concurrency:
  group: old-nse-hull-daily
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Initialise disposable database schema
        run: python -c "import config; from nse_loader import init_database; init_database(config.DB_PATH)"
      - name: Restore shared market snapshots
        run: python -c "import config; from nse_market_store import restore_prices; print(restore_prices(config.DB_PATH, min_days=1))"
      - name: Generate PAPER radar for pull-request validation
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/run_old_nse_hull_local.py --db nse_scanner.db --multi-horizon-shadow
      - name: Generate and deliver independent Old NSE plus Hull PAPER radar
        if: ${{ github.event_name != 'pull_request' }}
        env:
          LADDER_TELEGRAM_BOT_TOKEN: ${{ secrets.LADDER_TELEGRAM_BOT_TOKEN }}
          LADDER_TELEGRAM_CHAT_ID: ${{ secrets.LADDER_TELEGRAM_CHAT_ID }}
          LADDER_DAILY_TOPIC_ID: ${{ secrets.LADDER_DAILY_TOPIC_ID }}
          LADDER_PORTFOLIO_TOPIC_ID: ${{ secrets.LADDER_PORTFOLIO_TOPIC_ID }}
          LADDER_VALIDATION_TOPIC_ID: ${{ secrets.LADDER_VALIDATION_TOPIC_ID }}
          LADDER_SYSTEM_TOPIC_ID: ${{ secrets.LADDER_SYSTEM_TOPIC_ID }}
        run: python scripts/run_old_nse_hull_local.py --db nse_scanner.db --multi-horizon-shadow --send-telegram --send-shadow-preview
      - uses: actions/upload-artifact@v4
        with:
          name: old-nse-hull-daily-radar
          path: |
            output/old_nse_hull_daily.json
            output/old_nse_hull_daily.html
            output/old_nse_hull_shadow_preview.html
      - name: Persist multi-horizon shadow comparison ledger
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "nse-scanner-bot@users.noreply.github.com"
          git add old_nse_hull_shadow_state.json old_nse_hull_paper_state.json
          git add -f output/old_nse_hull_daily.json
          if git diff --cached --quiet; then
            echo "No shadow comparison state changes to commit."
          else
            bash scripts/persist_generated_state.sh "chore: record Old NSE Hull shadow comparison"
          fi
