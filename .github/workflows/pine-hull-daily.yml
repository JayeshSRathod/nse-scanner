name: Hull Pine EOD Paper System

on:
  schedule:
    # 02:45 UTC is 08:15 IST, after the shared data pipeline.
    - cron: '45 2 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: write

concurrency:
  group: pine-hull-daily
  cancel-in-progress: false

jobs:
  hull-pine-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest persisted market history
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run isolated Pine Hull paper system
        env:
          HULL_TELEGRAM_BOT_TOKEN: ${{ secrets.HULL_TELEGRAM_BOT_TOKEN }}
          HULL_TELEGRAM_CHAT_ID: ${{ secrets.HULL_TELEGRAM_CHAT_ID }}
          HULL_DAILY_TOPIC_ID: ${{ secrets.HULL_DAILY_TOPIC_ID }}
          HULL_PORTFOLIO_TOPIC_ID: ${{ secrets.HULL_PORTFOLIO_TOPIC_ID }}
        run: python scripts/run_pine_hull_daily.py --restore-snapshots --send-telegram

      - name: Persist Pine-only paper state
        shell: bash
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "nse-scanner-bot@users.noreply.github.com"
          git add pine_hull_state.json
          git add -f output/pine_hull_daily_run.json
          if git diff --cached --quiet; then
            echo "No Pine Hull state changes to commit."
          else
            bash scripts/persist_generated_state.sh "Auto: persist Pine Hull paper state"
          fi
