name: Momentum Ladder Weekly Review

on:
  schedule:
    - cron: '10 2 * * 6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  momentum-ladder-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Initialise and restore shared market data
        run: python -c "import config; from nse_loader import init_database; from nse_market_store import restore_prices; init_database(config.DB_PATH); print(restore_prices(config.DB_PATH, min_days=1))"
      - name: Send Momentum Ladder weekly PAPER review
        env:
          LADDER_TELEGRAM_BOT_TOKEN: ${{ secrets.LADDER_TELEGRAM_BOT_TOKEN }}
          LADDER_TELEGRAM_CHAT_ID: ${{ secrets.LADDER_TELEGRAM_CHAT_ID }}
          LADDER_REVIEW_TOPIC_ID: ${{ secrets.LADDER_REVIEW_TOPIC_ID }}
        run: python scripts/run_old_nse_hull_period.py weekly --send-telegram
