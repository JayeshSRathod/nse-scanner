name: NSE Pipeline Daily Run

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  V2_GO_LIVE_DATE: '2026-08-04'
  V3_ACTIVATION_DATE: '2026-08-19'

permissions:
  contents: write

concurrency:
  group: nse-pipeline-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANDIDATES_TOPIC_ID: ${{ secrets.TELEGRAM_CANDIDATES_TOPIC_ID }}
          TELEGRAM_PORTFOLIO_TOPIC_ID: ${{ secrets.TELEGRAM_PORTFOLIO_TOPIC_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
          NSE_MARKET_CAP_URL: ${{ vars.NSE_MARKET_CAP_URL }}
        run: python main_pipeline.py

      - name: Persist market history and reports
        shell: bash
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "nse-scanner-bot@users.noreply.github.com"
          git add market_data telegram_last_scan.json scan_history.json scan_health.json
          git add corporate_data/normalized 2>/dev/null || true
          git add -f output/nse_corporate_health.json 2>/dev/null || true
          git add -f output/v3_operational_readiness.json output/v3_bootstrap_result.json 2>/dev/null || true
          git add scan_lifecycle.json 2>/dev/null || true
          git add -f output/news_latest.json output/news_*.json 2>/dev/null || true
          git add portfolio.json 2>/dev/null || true
          git add v2_portfolio_state.json 2>/dev/null || true
          git add output/v2_daily_run.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scanner state changes to commit."
          else
            git commit -m "Auto: persist NSE market data and scan output"
            git push
          fi
