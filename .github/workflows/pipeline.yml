name: NSE Pipeline Daily Run

on:
  schedule:
    # 22:30 UTC Sunday-Thursday = 04:00 IST Monday-Friday.
    # Started early to absorb GitHub Actions schedule delays before the 08:00 IST deadline.
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      strict_v3:
        description: 'Run the strict-V3 eligibility policy after readiness passes'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  V2_GO_LIVE_DATE: '2026-08-04'
  V3_ACTIVATION_DATE: '2026-08-19'
  V3_STRICT_ENABLED: ${{ inputs.strict_v3 || 'false' }}

permissions:
  contents: write

concurrency:
  group: nse-pipeline-daily
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Pipeline
        env:
          V3_TELEGRAM_BOT_TOKEN: ${{ secrets.V3_TELEGRAM_BOT_TOKEN }}
          V3_TELEGRAM_CHAT_ID: ${{ secrets.V3_TELEGRAM_CHAT_ID }}
          V3_DAILY_TOPIC_ID: ${{ secrets.V3_DAILY_TOPIC_ID }}
          V3_PORTFOLIO_TOPIC_ID: ${{ secrets.V3_PORTFOLIO_TOPIC_ID }}
          V3_SYSTEM_TOPIC_ID: ${{ secrets.V3_SYSTEM_TOPIC_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          NSE_MARKET_CAP_URL: ${{ vars.NSE_MARKET_CAP_URL }}
        run: python main_pipeline.py

      - name: Persist market history and reports
        shell: bash
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "nse-scanner-bot@users.noreply.github.com"
          git add market_data telegram_last_scan.json scan_history.json scan_health.json
          git add corporate_data/normalized 2>/dev/null || true
          git add -f output/nse_corporate_health.json 2>/dev/null || true
          git add -f output/v3_operational_readiness.json output/v3_bootstrap_result.json output/v2_v3_eligibility_comparison.json 2>/dev/null || true
          git add scan_lifecycle.json 2>/dev/null || true
          git add v3_telegram_delivery_state.json 2>/dev/null || true
          git add -f output/news_latest.json output/news_*.json 2>/dev/null || true
          git add portfolio.json 2>/dev/null || true
          git add v2_portfolio_state.json 2>/dev/null || true
          git add -f output/v2_daily_run.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scanner state changes to commit."
          else
            bash scripts/persist_generated_state.sh "Auto: persist NSE market data and scan output"
          fi
