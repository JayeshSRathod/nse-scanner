name: NSE Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional first signal date (YYYY-MM-DD)"
        required: false
        type: string
      end_date:
        description: "Optional last signal date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run conservative EOD backtest
        run: |
          python nse_backtest.py --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: nse-backtest-results
          path: output/backtest/
