name: V2 Sprint 3 Calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python scripts/calibrate_sprint3.py --stride 5
      - uses: actions/upload-artifact@v4
        with:
          name: sprint3-calibration
          path: output/v2_calibration/
          retention-days: 30
