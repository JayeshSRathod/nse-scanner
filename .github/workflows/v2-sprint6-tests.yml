name: V2 Sprint 6 Operations Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v2-multi-horizon
      - main
    paths:
      - 'v2/index_ingestion.py'
      - 'v2/state_backup.py'
      - 'v2/health.py'
      - 'scripts/v2_operations.py'
      - 'tests/test_v2_sprint6.py'
      - '.github/workflows/v2-sprint6-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pytest pandas requests
      - run: python -m pytest -q tests/test_v2_sprint6.py tests/test_v2_sprint5.py tests/test_v2_sprint4_processor.py
