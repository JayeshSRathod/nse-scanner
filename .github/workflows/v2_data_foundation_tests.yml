name: V2 Data Foundation Tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v2-multi-horizon
      - main
    paths:
      - "nse_loader.py"
      - "scripts/audit_nse_database.py"
      - "scripts/migrate_v1_prices_to_v2.py"
      - "migrations/v2/**"
      - "tests/test_v2_data_foundation.py"
      - ".github/workflows/v2_data_foundation_tests.yml"
  pull_request:
    paths:
      - "nse_loader.py"
      - "scripts/audit_nse_database.py"
      - "scripts/migrate_v1_prices_to_v2.py"
      - "migrations/v2/**"
      - "tests/test_v2_data_foundation.py"

permissions:
  contents: read

concurrency:
  group: v2-data-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Compile Sprint 1 scripts
        run: |
          python -m py_compile nse_loader.py
          python -m py_compile scripts/audit_nse_database.py
          python -m py_compile scripts/migrate_v1_prices_to_v2.py

      - name: Run data-foundation tests
        run: python -m pytest -q tests/test_v2_data_foundation.py
