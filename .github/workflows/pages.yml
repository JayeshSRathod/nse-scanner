name: Publish NSE Mini App

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_miniapp_feed.py'
      - 'output/v2_daily_run.json'
      - 'output/old_nse_hull_daily.json'
      - 'output/penny_microcap/daily.json'
      - 'output/pine_hull_daily_run.json'
      - 'corporate_data/normalized/security_lifecycle_events.csv'
  workflow_run:
    workflows: ["NSE Pipeline Daily Run", "Old NSE Hull Daily Paper Radar", "Hull Pine EOD Paper System", "Penny Microcap Shadow Daily"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build public-safe scanner feed
        run: python scripts/build_miniapp_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
