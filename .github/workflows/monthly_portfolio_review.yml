name: Monthly Portfolio Review

on:
  workflow_dispatch:
    inputs:
      review_period:
        description: Optional review period in YYYY-MM format
        required: false
        type: string
  schedule:
    # 03:30 UTC = 09:00 IST on the first day of each month.
    - cron: "30 3 1 * *"

permissions:
  contents: write

concurrency:
  group: monthly-portfolio-review
  cancel-in-progress: false

jobs:
  build-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run Sprint 8 tests
        run: python -m pytest tests/test_portfolio_reader.py -q

      - name: Build active portfolio review queue
        shell: bash
        run: |
          PERIOD="${{ inputs.review_period }}"
          if [ -n "$PERIOD" ]; then
            python scripts/run_monthly_portfolio_review.py --period "$PERIOD"
          else
            python scripts/run_monthly_portfolio_review.py
          fi

      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: monthly-portfolio-review-queue
          path: data/review_queue.json
          if-no-files-found: error

      - name: Commit generated queue
        shell: bash
        run: |
          if git diff --quiet -- data/review_queue.json; then
            echo "No review queue changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_queue.json
          git commit -m "chore: update monthly portfolio review queue"
          git push
