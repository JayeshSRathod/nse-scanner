name: V2 Database and Snapshot Tests

on:
  workflow_dispatch:
  push:
    branches: [develop/v2-multi-horizon, main]
    paths:
      - 'v2/database.py'
      - 'v2/snapshots.py'
      - 'tests/test_v2_database_snapshots.py'
      - '.github/workflows/v2-snapshots-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip pytest pandas numpy
      - run: python -m pytest -q tests/test_v2_database_snapshots.py tests/test_v2_indicators_regime.py
