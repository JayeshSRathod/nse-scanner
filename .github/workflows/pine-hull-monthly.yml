name: Old NSE Hull Monthly Review

on:
  schedule:
    - cron: '40 3 1 * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  old-nse-hull-monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Initialise and restore shared market data
        run: python -c "import config; from nse_loader import init_database; from nse_market_store import restore_prices; init_database(config.DB_PATH); print(restore_prices(config.DB_PATH, min_days=1))"
      - name: Send Old NSE Hull monthly PAPER review
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PINE_MONTHLY_TOPIC_ID: ${{ secrets.TELEGRAM_PINE_MONTHLY_TOPIC_ID }}
        run: python scripts/run_old_nse_hull_period.py monthly --send-telegram
