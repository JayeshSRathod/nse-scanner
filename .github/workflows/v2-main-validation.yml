name: V2 Main Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip -r requirements.txt pytest
      - run: python -m pytest -q tests
