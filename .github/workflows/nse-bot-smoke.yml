name: NSE Bot Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V3_TELEGRAM_BOT_TOKEN: ${{ secrets.V3_TELEGRAM_BOT_TOKEN }}
      V3_TELEGRAM_CHAT_ID: ${{ secrets.V3_TELEGRAM_CHAT_ID }}
      V3_SYSTEM_TOPIC_ID: ${{ secrets.V3_SYSTEM_TOPIC_ID }}
      LADDER_TELEGRAM_BOT_TOKEN: ${{ secrets.LADDER_TELEGRAM_BOT_TOKEN }}
      LADDER_TELEGRAM_CHAT_ID: ${{ secrets.LADDER_TELEGRAM_CHAT_ID }}
      LADDER_SYSTEM_TOPIC_ID: ${{ secrets.LADDER_SYSTEM_TOPIC_ID }}
      HULL_TELEGRAM_BOT_TOKEN: ${{ secrets.HULL_TELEGRAM_BOT_TOKEN }}
      HULL_TELEGRAM_CHAT_ID: ${{ secrets.HULL_TELEGRAM_CHAT_ID }}
      HULL_SYSTEM_TOPIC_ID: ${{ secrets.HULL_SYSTEM_TOPIC_ID }}
      GITHUB_TOKEN: ${{ secrets.NSE_REPO_TOKEN }}
      GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
      GITHUB_BRANCH: ${{ secrets.GITHUB_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate bot startup
        run: python scripts/startup_check.py

      - name: Verify isolated bot, chat and topic routes
        run: python scripts/telegram_route_smoke.py
