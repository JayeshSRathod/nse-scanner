name: NSE Weekly Digest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nse-weekly-digest.yml'
      - 'nse_weekly_digest.py'
      - 'telegram_dashboard.py'
  schedule:
    # Saturday 07:30 IST. GitHub schedules are UTC.
    - cron: '0 2 * * 6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: nse-weekly-digest
  cancel-in-progress: false

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout scanner state
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore saved daily prices
        run: |
          python -c "import config; from nse_loader import init_database; from nse_market_store import restore_prices; init_database(config.DB_PATH); print('Restored snapshots:', restore_prices(config.DB_PATH, min_days=1))"

      - name: Send weekly model digest
        env:
          V3_TELEGRAM_BOT_TOKEN: ${{ secrets.V3_TELEGRAM_BOT_TOKEN }}
          V3_TELEGRAM_CHAT_ID: ${{ secrets.V3_TELEGRAM_CHAT_ID }}
          V3_WEEKLY_TOPIC_ID: ${{ secrets.V3_WEEKLY_TOPIC_ID }}
        run: python nse_weekly_digest.py
