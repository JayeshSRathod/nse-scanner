<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>NSE Scanner Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#657087;--line:#dce2ec;--blue:#2675ec;--green:#168455;--amber:#a86600;--red:#c93b43}
    @media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#191f2b;--text:#f2f5fa;--muted:#9ba6ba;--line:#303949;--blue:#65a1ff;--green:#54d69a;--amber:#ffc25f;--red:#ff7c83}}
    *{box-sizing:border-box}body{margin:0;background:var(--tg-theme-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--text));font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:860px;margin:auto;padding:18px 14px 84px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{font-size:23px;margin:0 0 4px}.muted{color:var(--tg-theme-hint-color,var(--muted))}.paper{font-size:11px;font-weight:800;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);padding:5px 8px;border-radius:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.metric,.card{background:var(--tg-theme-secondary-bg-color,var(--card));border:1px solid var(--line);border-radius:14px}.metric{padding:11px}.metric b{display:block;font-size:19px}.controls{position:sticky;top:0;z-index:2;background:var(--tg-theme-bg-color,var(--bg));padding:8px 0}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tab,.stage{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:22px;padding:8px 11px;font-weight:700}.tab.on,.stage.on{background:var(--blue);border-color:var(--blue);color:#fff}.tab:disabled{opacity:.45}.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:11px 12px;font-size:14px}.stages{display:flex;gap:7px;overflow:auto;margin:9px 0 13px}.list{display:grid;gap:10px}.card{padding:13px}.row{display:flex;justify-content:space-between;gap:12px}.symbol{font-size:17px;font-weight:850}.badge{font-size:12px;font-weight:750}.ready{color:var(--green)}.building{color:var(--amber)}.risk{color:var(--red)}.price{font-size:18px;font-weight:800;text-align:right}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.detail{background:color-mix(in srgb,var(--card) 82%,var(--line));padding:8px;border-radius:9px}.detail span{display:block;font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:11px}.actions a{color:var(--blue);font-weight:750;text-decoration:none}.empty{text-align:center;padding:48px 20px;color:var(--muted)}footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:520px){.details{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.metric{padding:8px}.metric b{font-size:16px}}
  </style>
</head>
<body><main class="wrap">
  <div class="top"><div><h1>NSE Scanner Dashboard</h1><div class="muted" id="date">Loading latest completed market data…</div></div><span class="paper">PAPER TRACKING</span></div>
  <section class="summary"><div class="metric"><b id="visible">—</b><span class="muted">Shown</span></div><div class="metric"><b id="ready">—</b><span class="muted">Ready</span></div><div class="metric"><b id="building">—</b><span class="muted">Building</span></div></section>
  <div class="controls"><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="Search stock name…"><div class="stages" id="stages"></div></div>
  <section class="list" id="list"></section><footer id="notice"></footer>
</main>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()}
let feed={items:[],scanners:[]},scanner='all',stage='all',query='';
const stageOrder=['all','Watch for entry','Watchlist—wait for confirmation','Early watchlist','New paper entry','Open paper position','No entry—circuit risk','Wait for pullback','No action yet'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number.isFinite(n)?`₹${n.toLocaleString('en-IN',{maximumFractionDigits:2})}`:'Not available';
const cls=s=>s.includes('entry')||s.includes('position')?'ready':s.includes('circuit')||s.includes('pullback')?'risk':'building';
function filtered(){return feed.items.filter(x=>(scanner==='all'||x.scanner===scanner)&&(stage==='all'||x.stage===stage)&&(!query||x.symbol.includes(query)))}
function setScanner(v){scanner=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function setStage(v){stage=v;document.querySelectorAll('.stage').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
function render(){const rows=filtered();document.getElementById('visible').textContent=rows.length;document.getElementById('ready').textContent=rows.filter(x=>x.stage.includes('Ready')||x.stage.includes('opened')).length;document.getElementById('building').textContent=rows.filter(x=>x.stage.includes('building')||x.stage.includes('starting')).length;
 document.getElementById('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No stocks match this view today.</div>'}
function card(x){const range=x.entry_low!=null?(x.entry_high!=null&&x.entry_high!==x.entry_low?`${money(x.entry_low)}–${money(x.entry_high)}`:money(x.entry_low)):'Wait for a valid range';return `<article class="card"><div class="row"><div><div class="symbol">${esc(x.symbol)}</div><div class="badge ${cls(x.stage)}">${esc(x.stage)}</div></div><div><div class="price">${money(x.price)}</div><div class="muted">Score ${x.score??'—'}/100</div></div></div><div class="details"><div class="detail"><span>Possible entry</span>${range}</div><div class="detail"><span>Safety exit</span>${money(x.stop)}</div><div class="detail"><span>First target</span>${money(x.target1)}</div><div class="detail"><span>Second target</span>${money(x.target2)}</div></div><div class="actions"><a href="https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(x.symbol)}" target="_blank">View TradingView chart ↗</a></div></article>`}
function buttons(){const tabs=[{id:'all',name:'All scanners'},...feed.scanners];const start=new URLSearchParams(location.search).get('tgWebAppStartParam')||new URLSearchParams(location.search).get('startapp');if(feed.scanners.some(s=>s.id===start&&s.available))scanner=start;document.getElementById('tabs').innerHTML=tabs.map(s=>`<button class="tab ${s.id===scanner?'on':''}" data-v="${s.id}" ${s.available===false?'disabled title="Dashboard feed not available yet"':''}>${esc(s.name)}</button>`).join('');document.querySelectorAll('.tab:not(:disabled)').forEach(b=>b.onclick=()=>setScanner(b.dataset.v));const available=new Set(feed.items.map(x=>x.stage));document.getElementById('stages').innerHTML=stageOrder.filter(s=>s==='all'||available.has(s)).map(s=>`<button class="stage ${s==='all'?'on':''}" data-v="${esc(s)}">${s==='all'?'All stages':esc(s)}</button>`).join('');document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>setStage(b.dataset.v))}
fetch('data/feed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{feed=data;buttons();const dates=Object.values(feed.market_dates||{}).filter(Boolean).sort();document.getElementById('date').textContent=dates.length?`Latest market date: ${dates.at(-1)}`:'Latest saved scanner data';document.getElementById('notice').textContent=feed.notice;render()}).catch(()=>document.getElementById('list').innerHTML='<div class="empty">The dashboard feed is not available yet. Please try again after the next scanner run.</div>');
document.getElementById('search').oninput=e=>{query=e.target.value.trim().toUpperCase();render()};
</script></body></html>
